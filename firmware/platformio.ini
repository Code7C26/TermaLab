; Firmware del módulo central de TermaLab Cocina
; ESP32 WROOM-32 (38 pines, USB-C, CP2102) + MAX6675 + termocupla K

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; deja más lugar para el programa (Wi-Fi + HTTPS + portal de configuración)
board_build.partitions = huge_app.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
